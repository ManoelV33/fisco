<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#13284a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fisco">
<title>Fisco</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<section class="gate" id="gate" aria-label="Rumo ao Fisco">
  <form class="gate-box" id="gate-form" autocomplete="off">
    <svg class="gate-f" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="prata" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".38" stop-color="#c4cbd4"/><stop offset=".52" stop-color="#969eaa"/><stop offset=".62" stop-color="#dee3ea"/><stop offset="1" stop-color="#848c98"/></linearGradient></defs><polygon points="27,17 79,17 73,33 45,33 45,43 69,43 63,58 45,58 45,83 27,83" fill="url(#prata)"/></svg>
    <h1 class="gate-title">Rumo ao Fisco</h1>
    <label class="gate-label" for="gate-senha">Senha</label>
    <input class="gate-input" id="gate-senha" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
    <button class="gate-btn" type="submit" id="gate-ok">Entrar</button>
    <p class="gate-msg" id="gate-msg" role="status" aria-live="polite"></p>
  </form>
</section>

<div class="app" id="app" hidden>
  <header class="topbar"><div class="in"><span class="marca"><svg viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="prata2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset=".45" stop-color="#c4cbd4"/><stop offset=".6" stop-color="#e3e7ec"/><stop offset="1" stop-color="#9aa2ad"/></linearGradient></defs><polygon points="27,17 79,17 73,33 45,33 45,43 69,43 63,58 45,58 45,83 27,83" fill="url(#prata2)"/></svg>Fisco</span><button class="lock" data-act="bloquear" id="btn-lock">Sair</button></div></header>
  <div class="wrap" id="main" aria-live="polite"></div>
  <nav class="bottom" aria-label="Seções">
    <div class="in">
      
      <button data-act="nav" data-v="estudar" id="nav-estudar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M9 12l2 2 4-4"/></svg>Rumo ao Fisco</button>
      <button data-act="nav" data-v="desempenho" id="nav-desempenho"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Desempenho</button>
    </div>
  </nav>
</div>
<script src="app.js"></script>
</body>
</html>
